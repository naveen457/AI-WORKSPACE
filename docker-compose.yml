services:
  frontend:
    image: naveenchowdary577/astrix-frontend:${FRONTEND_TAG:-${TAG:-latest}}
    build:
      context: ./client
      args:
        VERSION: ${FRONTEND_TAG:-${TAG:-latest}}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:5173"
    environment:
      PORT: 5173

  backend:
    image: naveenchowdary577/astrix-backend:${BACKEND_TAG:-${TAG:-latest}}
    build:
      context: ./server
      args:
        VERSION: ${BACKEND_TAG:-${TAG:-latest}}
    ports:
      - "5000:5000"

    env_file:
      - ./server/.env
    environment:
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      RL_LLM_API_URL: ${RL_LLM_API_URL:-}
